<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>اختبار قاعدة بيانات بضاعة الندوة</title>
<style>
body {
  font-family: Arial, sans-serif;
  max-width: 600px;
  margin: auto;
  padding: 16px;
  background: #f3f5f7;
  color: #202b32;
}
section {
  background: white;
  padding: 16px;
  margin-bottom: 14px;
  border-radius: 12px;
}
input, button {
  width: 100%;
  box-sizing: border-box;
  padding: 12px;
  margin: 6px 0;
  font-size: 16px;
}
button {
  background: #174c3c;
  color: white;
  border: 0;
  border-radius: 8px;
}
#result {
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}
</style>
</head>
<body>

<h2>اختبار قاعدة بيانات بضاعة الندوة</h2>

<section>
  <h3>تسجيل الدخول</h3>

  <input id="email" type="email"
         placeholder="البريد الإلكتروني">

  <input id="password" type="password"
         placeholder="كلمة المرور">

  <button onclick="signUp()">إنشاء حساب</button>
  <button onclick="signIn()">تسجيل الدخول</button>
</section>

<section>
  <h3>اختبار حفظ واسترجاع منتج</h3>

  <button id="testButton" onclick="testProduct()" disabled>
    حفظ المنتج واسترجاعه
  </button>

  <p id="result">سجّل الدخول أولاً.</p>
</section>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
const SUPABASE_URL = "https://eqtzokxomfvzeivrlat.supabase.co";
const SUPABASE_KEY = "sb_publishable_...ضع_مفتاحك_هنا...";

const db = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

const result = document.getElementById("result");
let currentUser = null;

async function signUp() {
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;

  result.textContent = "جارٍ إنشاء الحساب...";

  const { data, error } = await db.auth.signUp({
    email,
    password
  });

  if (error) {
    result.textContent = "خطأ: " + error.message;
    return;
  }

  if (data.session) {
    currentUser = data.user;
    document.getElementById("testButton").disabled = false;
    result.textContent = "تم إنشاء الحساب وتسجيل الدخول.";
  } else {
    result.textContent =
      "تم طلب إنشاء الحساب. إذا طُلب تأكيد البريد، أكّد حسابك ثم سجّل الدخول.";
  }
}

async function signIn() {
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;

  result.textContent = "جارٍ تسجيل الدخول...";

  const { data, error } = await db.auth.signInWithPassword({
    email,
    password
  });

  if (error) {
    result.textContent = "تعذّر تسجيل الدخول: " + error.message;
    return;
  }

  currentUser = data.user;
  document.getElementById("testButton").disabled = false;

  result.textContent = "تم تسجيل الدخول بنجاح.";
}

async function testProduct() {
  if (!currentUser) {
    result.textContent = "سجّل الدخول أولاً.";
    return;
  }

  result.textContent = "جارٍ حفظ منتج الاختبار...";

  const product = {
    user_id: currentUser.id,
    name: "منتج اختبار قاعدة البيانات " + Date.now(),
    purchase_price_usd: 1.23,
    pieces_per_package: 10,
    selling_price_try: 5,
    stock: 1,
    image: "",
    pick_count: 0
  };

  const { data: saved, error: saveError } = await db
    .from("products")
    .insert(product)
    .select()
    .single();

  if (saveError) {
    result.textContent =
      "فشل الحفظ:\n" + saveError.message;
    return;
  }

  result.textContent = "تم الحفظ. جارٍ استرجاع المنتج...";

  const { data: loaded, error: readError } = await db
    .from("products")
    .select("*")
    .eq("id", saved.id)
    .eq("user_id", currentUser.id)
    .single();

  if (readError) {
    result.textContent =
      "تم الحفظ لكن فشل الاسترجاع:\n" + readError.message;
    return;
  }

  result.textContent =
    "نجح الاختبار!\n\n" +
    "رقم المنتج: " + loaded.id + "\n" +
    "الاسم: " + loaded.name + "\n" +
    "سعر الشراء: $" + loaded.purchase_price_usd + "\n" +
    "عدد القطع: " + loaded.pieces_per_package + "\n" +
    "سعر البيع: " + loaded.selling_price_try + " ل.ت\n" +
    "المخزون: " + loaded.stock + "\n\n" +
    "تم حفظ المنتج واسترجاعه من قاعدة البيانات.";
}

db.auth.getSession().then(({ data, error }) => {
  if (error) {
    result.textContent = "خطأ في الجلسة: " + error.message;
    return;
  }

  if (data.session) {
    currentUser = data.session.user;
    document.getElementById("testButton").disabled = false;
    result.textContent = "تم استعادة جلسة تسجيل الدخول.";
  }
});
</script>

</body>
</html>
