name: Validate application

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Check backend and worker JavaScript syntax
        run: |
          set -e
          for file in api/*.js server/*.js scripts/*.js sw.js; do
            node --check "$file"
          done
      - name: Check storage ES module syntax
        run: node --input-type=module --check < storage.js
      - name: Extract and check the application module
        run: |
          python3 - <<'PY'
          from pathlib import Path
          html = Path("index.html").read_text(encoding="utf-8")
          marker = '<script type="module">'
          start = html.find(marker)
          if start < 0:
              raise SystemExit("Inline application module was not found")
          start += len(marker)
          end = html.find("</script>", start)
          if end < 0:
              raise SystemExit("Inline application module closing tag was not found")
          Path("/tmp/nadwa-app-module.mjs").write_text(html[start:end], encoding="utf-8")
          PY
          node --input-type=module --check < /tmp/nadwa-app-module.mjs
      - name: Validate app metadata, offline shell, and HTML IDs
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          import re
          manifest = json.loads(Path("manifest.json").read_text(encoding="utf-8"))
          json.loads(Path("rates.json").read_text(encoding="utf-8"))
          if manifest.get("start_url") != "./" or manifest.get("scope") != "./":
              raise SystemExit("PWA start_url/scope must remain relative to the deployment path")
          sw = Path("sw.js").read_text(encoding="utf-8")
          match = re.search(r"const APP_SHELL = \[(.*?)\];", sw, re.S)
          if not match:
              raise SystemExit("Service worker APP_SHELL declaration is missing")
          for asset in re.findall(r"""["']([^"']+)["']""", match.group(1)):
              path = asset.removeprefix("./")
              if not Path(path).exists():
                  raise SystemExit(f"Missing offline shell asset: {asset}")
          html = Path("index.html").read_text(encoding="utf-8")
          ids = re.findall('id="([^"]+)"', html.split('<script type="module">', 1)[0])
          duplicates = sorted({item for item in ids if ids.count(item) > 1})
          if duplicates:
              raise SystemExit("Duplicate HTML IDs: " + ", ".join(duplicates))
          print("Metadata, offline shell assets, and HTML IDs validated.")
          PY
